name: "Policy Lock"
description: >-
  Kestrel Robotics spins up one CloudFormation stack per pull request so
  reviewers get a live preview. Last quarter an engineer deleted production by
  mistake, so the shared deploy wrapper now switches on termination protection
  for every stack it creates, previews included. The nightly cleanup job has
  been failing ever since: the stack for the merged PR #731 refuses to go away
  and its bucket and topic keep costing money. PR #742 is still under review
  and production runs in kestrel-prod-core.
objective: >-
  Remove the preview stack kestrel-pr-731 and its resources, while
  kestrel-pr-742 and kestrel-prod-core stay deployed and keep their termination
  protection.
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - termination protection
  - stack protection
  - stack policies
services:
  - cloudformation
  - s3
  - sns
