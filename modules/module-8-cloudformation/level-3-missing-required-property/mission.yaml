name: "Nobody Can Wear This Role"
description: >-
  Lumen Labs' nightly job exports lab results by signing in as the IAM user
  export-runner and assuming the role lumen-exporter, which is created by the
  lumen-export stack. The stack deployed without a single error, but every
  night the job dies on its very first call with an AccessDenied from
  sts:AssumeRole. The permissions on the role look fine.
objective: >-
  Fix the lumen-export stack so that export-runner can assume lumen-exporter
  and upload results to the lumen-lab-exports bucket. No other principal may be
  able to assume the role, and the role must still be unable to write to
  anything but that bucket.
xp: 125
difficulty: beginner
expected_time: 10m
concepts:
  - AWS::IAM::Role
  - AssumeRolePolicyDocument
  - required properties
services:
  - cloudformation
  - iam
  - sts
  - s3
