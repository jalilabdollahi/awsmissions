name: "SAM Template Rejected"
description: >-
  Parcelhub's courier team writes its notifier Lambda with the AWS Serverless
  Application Model (SAM) shorthand: a single AWS::Serverless::Function
  instead of a function, a role and an alias spelled out by hand. They deploy
  template.yaml as the stack parcelhub-notifier. CloudFormation answers with a
  perfectly green status, yet there is no Lambda function anywhere in the
  account, and the dispatch system gets "function not found" when it tries to
  call parcel-notifier.
objective: >-
  Deploy template.yaml as the stack parcelhub-notifier so that the Lambda
  function parcel-notifier really exists and answers an invocation with the
  stage name from its environment.
xp: 275
difficulty: advanced
expected_time: 15m
concepts:
  - CloudFormation Transform
  - AWS SAM
  - macros
services:
  - cloudformation
  - lambda
