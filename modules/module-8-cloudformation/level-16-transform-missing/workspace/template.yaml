AWSTemplateFormatVersion: "2010-09-09"
Description: Parcelhub courier notifier (SAM)
Resources:
  Notifier:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: parcel-notifier
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          STAGE: courier-live
      InlineCode: |
        import os
        def handler(event, context):
            return {"stage": os.environ["STAGE"]}
