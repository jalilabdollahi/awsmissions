name: "Handle With Care"
description: >-
  Nightjar Finance is retiring the nightjar-archive stack: it was a pilot, and
  the team wants CloudFormation out of the picture. The stack, however, owns
  the ledger archive bucket and the ledger index table, both full of records
  the auditors will ask for next year. Only the small events topic is
  disposable. A colleague once ran delete-stack on a sibling stack "to see
  what happens" and the table went with it.
objective: >-
  Retire the nightjar-archive stack completely (it must be gone, and the events
  topic with it) while the ledger archive bucket and the ledger index table
  survive with every record intact.
xp: 300
difficulty: advanced
expected_time: 15m
concepts:
  - DeletionPolicy
  - Retain
  - stack deletion
  - data safety
services:
  - cloudformation
  - s3
  - dynamodb
  - sns
