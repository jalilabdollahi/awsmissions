name: "Parse Error"
description: >-
  Harbor Lights Ferry is moving its passenger-info plumbing into CloudFormation.
  Priya, the new platform engineer, wrote template.yaml for the timetable
  bucket and the delay-alert topic, but the very first deploy dies before a
  single resource is created. The CLI only prints a terse "Template format
  error" and Priya has already stared at the file for an hour.
objective: >-
  Deploy template.yaml as a stack named harborlights-core and get it to
  CREATE_COMPLETE, with the versioned timetable bucket and the delay-alert
  topic both really present.
xp: 75
difficulty: beginner
expected_time: 6m
concepts:
  - CloudFormation template format
  - YAML indentation
  - create-stack
services:
  - cloudformation
  - s3
  - sns
