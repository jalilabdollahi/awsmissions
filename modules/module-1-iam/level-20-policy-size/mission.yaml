name: "The Bloated Policy"
description: >-
  Fleetwise Telematics collects vehicle telemetry in one S3 bucket per region,
  fleet-<region>-telemetry, fourteen in total. The analytics user fleet-ops is
  supposed to read from all of them. A generated policy draft is sitting in your
  workspace, but whenever someone tries to attach it to the user, IAM refuses
  it. For now fleet-ops can only list bucket names. There is also a
  fleet-payroll bucket in the account that the analytics user must never read.
objective: >-
  Give fleet-ops read access (list and get) to all fourteen regional telemetry
  buckets, without exposing fleet-payroll, even though the draft cannot be
  attached the way it is.
xp: 450
difficulty: expert
expected_time: 15m
concepts:
  - IAM policy size limits
  - inline vs managed policies
  - policy consolidation
services:
  - iam
  - s3
