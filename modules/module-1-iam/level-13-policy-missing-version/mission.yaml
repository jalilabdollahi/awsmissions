name: "Dollar Signs Without Meaning"
description: >-
  Lumen Studios gives every employee a private folder in the lumen-homes
  bucket, named after their IAM user. One shared policy, home-folders, is meant
  to resolve ${aws:username} to each person's own folder. It is attached to the
  group lumen-staff, which both Alice and Bob belong to. Neither can open a
  single file in their own folder, and the policy document looks just like the
  examples in the docs.
objective: >-
  Make home-folders work for everyone in lumen-staff: each user can read and
  write files under their own folder (a prefix named after their username) in
  lumen-homes, and cannot read anybody else's. Keep using the one shared
  managed policy.
xp: 225
difficulty: intermediate
expected_time: 12m
concepts:
  - IAM policy variables
  - policy Version element
  - managed policy versions
services:
  - iam
  - s3
