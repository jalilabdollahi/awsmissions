name: "Frozen in Time"
description: >-
  Forgepoint Software deploys build artifacts with the IAM user forge-deployer.
  The user has the AWS managed policy AmazonS3FullAccess, so S3 should not be a
  problem, but uploads and deletes in the artifacts bucket now fail with
  AccessDenied. Over the years the user collected a few inline policies: some
  from past incidents, one that protects the production ledger bucket on
  purpose, and the ledger bucket must stay write-protected.
objective: >-
  Restore forge-deployer's ability to upload and delete objects in
  forge-artifacts. Keep the intentional protection on forge-ledger-prod: the
  user must still be unable to write to it. Do not remove the managed policy.
xp: 250
difficulty: advanced
expected_time: 12m
concepts:
  - explicit Deny
  - inline vs managed policies
  - policy evaluation logic
services:
  - iam
  - s3
