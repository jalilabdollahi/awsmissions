name: "Trust Issues"
description: >-
  Orbit Ledger recently consolidated its AWS accounts. The nightly bookkeeping
  batch signs in as the IAM user ledger-batch and is supposed to assume the role
  ledger-nightly to read the books in the orbit-ledger-books bucket. Since the
  migration, assuming the role fails with AccessDenied, even though ledger-batch
  is allowed to call sts:AssumeRole on it.
objective: >-
  Let ledger-batch assume ledger-nightly and read the books. Other IAM users in
  the account that are allowed to call sts:AssumeRole in general must still be
  unable to assume this role.
xp: 150
difficulty: intermediate
expected_time: 8m
concepts:
  - role trust policies
  - IAM principals and ARNs
  - cross-account migrations
services:
  - iam
  - sts
  - s3
