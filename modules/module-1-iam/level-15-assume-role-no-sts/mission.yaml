name: "One Hat Short"
description: >-
  Cobalt Bank's external auditor signs in as the IAM user cobalt-auditor and is
  meant to switch into the role cobalt-audit-readonly to read the
  cobalt-audit-logs bucket. The role's trust policy already trusts the account,
  and the auditor has been told the role ARN, but "aws sts assume-role" is
  answered with AccessDenied. There is a second role in the account,
  cobalt-finance-admin, with the same trust policy and far more power.
objective: >-
  Let cobalt-auditor assume cobalt-audit-readonly and read the audit logs
  through it. The auditor must still be unable to assume cobalt-finance-admin.
xp: 225
difficulty: intermediate
expected_time: 10m
concepts:
  - sts:AssumeRole
  - identity-based permission to assume a role
  - same-account trust
services:
  - iam
  - sts
  - s3
