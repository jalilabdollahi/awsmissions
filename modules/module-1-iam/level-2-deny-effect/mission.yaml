name: "Wrong Side of the Law"
description: >-
  PixelForge's image-upload worker runs as the IAM role pixelforge-uploader.
  Since this morning's "permissions cleanup" every upload fails with
  AccessDenied, and the support queue is filling up. The worker can still list
  the bucket, so the role itself is fine — something in its inline policy is
  actively blocking writes.
objective: >-
  Make the role pixelforge-uploader able to upload objects under
  s3://pixelforge-uploads/incoming/ — without giving it write access to any
  other bucket or prefix.
xp: 100
difficulty: beginner
expected_time: 6m
concepts:
  - IAM policy evaluation
  - explicit Deny
  - s3:PutObject
services:
  - iam
  - s3
  - sts
