name: "Silent Checkout"
description: >-
  Marigold Market's checkout-worker has been running fine for weeks, but the
  on-call dashboard that reads the CloudWatch log group /ecs/checkout-worker has
  been empty ever since the service moved to Fargate. The task definition
  revision 1 configures the container's logs with the journald logging driver,
  copied from the old EC2 setup. Fargate only ships logs through supported
  drivers such as awslogs. The log group already exists and has a 14-day
  retention that must be kept.
objective: >-
  Make checkout-worker's logs arrive in the existing /ecs/checkout-worker log
  group: register a corrected task definition revision using the awslogs driver and
  roll the service onto it. The log group (and its retention) must not be
  recreated.
xp: 200
difficulty: intermediate
expected_time: 10m
concepts:
  - awslogs log driver
  - Fargate logging
  - CloudWatch Logs
services:
  - ecs
  - logs
