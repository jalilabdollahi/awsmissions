name: "Who Is inventory.shop.local?"
description: >-
  Bramble Shop's catalog service looks up the inventory service by the DNS name
  inventory.shop.local, a convention every team agreed on. Two ECS services exist
  (catalog and inventory) but the lookup fails: there is no shop.local namespace
  and the inventory tasks are not registered anywhere. The inventory service runs
  two tasks, whose IP addresses change at every deployment, so hard-coding them is
  not an option.
objective: >-
  Set up AWS Cloud Map service discovery so that the name inventory.shop.local
  resolves to the live inventory tasks: a private DNS namespace shop.local, a
  service named inventory with A records, and the ECS inventory service
  registered to it. Every running inventory task must be listed with its real IP.
xp: 350
difficulty: advanced
expected_time: 15m
concepts:
  - AWS Cloud Map
  - ECS service discovery
  - private DNS namespaces
services:
  - ecs
  - servicediscovery
