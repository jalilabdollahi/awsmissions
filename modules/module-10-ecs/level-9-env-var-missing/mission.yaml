name: "Crash on Arrival"
description: >-
  Pulse Metrics' ingest worker (ECS service pulse-ingest, a queue consumer, not an
  HTTP API) keeps starting and dying. The service always shows desired 1, running
  0, and a growing list of stopped tasks. The container exits within a second of
  starting. The application's start-up script validates its environment; its
  output goes to the CloudWatch log group /ecs/pulse-ingest.
objective: >-
  Make pulse-ingest stay up: find out why the container exits, fix the
  configuration in a new task definition revision, and roll the service onto it.
  The worker must run in the mode that fits a queue consumer.
xp: 175
difficulty: intermediate
expected_time: 10m
concepts:
  - container environment variables
  - task logs
  - exit codes
services:
  - ecs
  - logs
