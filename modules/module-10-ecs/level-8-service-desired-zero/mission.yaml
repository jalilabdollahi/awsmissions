name: "Paused for Maintenance, Never Resumed"
description: >-
  Sundial Scheduling's booking API is the ECS service sundial-api in the sundial
  cluster. Last Friday an engineer scaled it to zero for a database maintenance
  window and went on holiday. The service shows ACTIVE and green in the console,
  yet customers get 503 from the load balancer. The runbook says production
  keeps two tasks, so a rolling deploy never drops to zero capacity.
objective: >-
  Bring sundial-api back with two running tasks (desired = running = 2) serving
  HTTP on port 80, without changing its task definition.
xp: 75
difficulty: beginner
expected_time: 5m
concepts:
  - desiredCount
  - ECS services
  - capacity
services:
  - ecs
