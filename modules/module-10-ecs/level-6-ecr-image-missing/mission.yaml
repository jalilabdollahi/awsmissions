name: "The Image That Wasn't There"
description: >-
  Hearthstone Pantry's storefront task stops within a second of being launched by
  deploy.sh; the container never starts. The release pipeline publishes the
  approved image reference for the storefront into Parameter Store at
  /hearth/web/approved-image after every build, but task-definition.json was last
  edited by hand during an incident.
objective: >-
  Get a hearth-web task running that uses exactly the image the release pipeline
  approved (the value of /hearth/web/approved-image), and serving HTTP on port 80.
xp: 150
difficulty: intermediate
expected_time: 10m
concepts:
  - image references
  - stoppedReason
  - registry pulls
services:
  - ecs
  - ssm
