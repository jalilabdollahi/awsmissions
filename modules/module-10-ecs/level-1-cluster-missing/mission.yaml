name: "The Cluster That Never Was"
description: >-
  Ledgerly's finance team runs a nightly ledger report as an ECS Fargate task. The
  task definition nightly-report is registered, and run-report.sh has worked for
  months, but this morning it prints an error and no report was produced. A
  migration script that "tidied up old clusters" ran last night.
objective: >-
  Get the nightly-report task running again on the ECS cluster named
  ledgerly-batch, using the registered task definition.
xp: 100
difficulty: beginner
expected_time: 6m
concepts:
  - ECS clusters
  - run-task
  - Fargate
services:
  - ecs
