name: "Expensive Archive"
description: >-
  Hotline Media's web team reports that the autumn campaign banner and the
  site stylesheet in the bucket hotline-media load for hours, or not at all: both
  objects under live/ are stored in the GLACIER class. Someone wrote a lifecycle
  rule "age-out-media" meant for old campaigns, but it names the wrong prefix,
  so it keeps pushing live files into Glacier a day after they are touched. The
  lifecycle rule for old campaigns under archive/ is correct and those objects
  belong in Glacier. The live objects carry a Content-Type and custom metadata
  that the site depends on.
objective: >-
  Put the objects under live/ back in the STANDARD storage class without
  losing their content, Content-Type or user metadata, stop the lifecycle from
  archiving them again, and leave the archive/ objects and their rule alone.
xp: 250
difficulty: advanced
expected_time: 16m
concepts:
  - storage classes
  - lifecycle transitions
  - copy-object metadata directive
services:
  - s3
