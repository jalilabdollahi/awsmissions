name: "Read-Only Trap"
description: >-
  Nimbus Labs' CI pipeline authenticates as the IAM user ci-runner. It can pull
  yesterday's build from the bucket nimbus-build-artifacts without trouble, but
  every publish step fails with AccessDenied. Release engineering says the
  bucket policy (copy in your workspace) "definitely has a publish statement".
  The release-manager user publishes to releases/ and must keep doing so.
objective: >-
  Let ci-runner upload build outputs under artifacts/ in nimbus-build-artifacts
  while it keeps reading the bucket. It must not be able to write anywhere else
  or delete anything, and release-manager must still be able to publish under
  releases/.
xp: 100
difficulty: beginner
expected_time: 8m
concepts:
  - bucket policies
  - object vs bucket ARNs
  - s3:PutObject
services:
  - s3
  - iam
