name: "Silent Arrivals"
description: >-
  AcornPay's accounts-payable robot is supposed to wake up whenever a supplier
  invoice PDF lands in s3://acornpay-invoices/inbox/. It reads jobs from the SQS
  queue invoice-intake. Since the bucket was rebuilt last week the queue stays
  empty: scanner-svc uploads invoices fine, but the robot never hears about
  them. Other file types in inbox/ (cover letters, notes) and anything outside
  inbox/ must not create jobs.
objective: >-
  Make S3 send a message to the queue invoice-intake whenever a new .pdf object
  is created under inbox/, and only then.
xp: 175
difficulty: intermediate
expected_time: 12m
concepts:
  - S3 event notifications
  - SQS destinations
  - prefix and suffix filters
services:
  - s3
  - sqs
  - iam
