name: "Unexpected Bills"
description: >-
  Ridgeline Analytics' finance team is fielding angry mail: partner companies
  say their automated downloads from the Ridgeline buckets now fail or show up
  on their own AWS invoice. Requester Pays was switched on across the account
  last week by a script that was supposed to touch only the public dataset
  bucket ridgeline-open-data, where downloaders really are meant to pay for
  their own transfer. All other Ridgeline buckets are normal buckets that the
  company pays for.
objective: >-
  Find every Ridgeline bucket that has Requester Pays turned on by mistake and
  make the bucket owner pay again, but leave the public dataset bucket
  ridgeline-open-data on Requester Pays.
xp: 200
difficulty: intermediate
expected_time: 10m
concepts:
  - Requester Pays
  - bucket payer configuration
  - auditing many buckets
services:
  - s3
  - iam
