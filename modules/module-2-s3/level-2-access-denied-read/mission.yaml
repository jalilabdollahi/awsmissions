name: "Keep Out"
description: >-
  Meridian Insurance keeps its quarterly audit packs in the bucket
  meridian-audit-reports. The external auditor logs in as the IAM user
  auditor-dana, and since Monday every download fails with AccessDenied. Dana's
  user has no IAM permissions of its own: access was always granted by the
  bucket policy, a copy of which is in your workspace. The same bucket also holds
  payroll exports that Dana must never see.
objective: >-
  Let auditor-dana download everything under reports/ in
  meridian-audit-reports, while payroll/ stays off limits, nobody gains write
  access, and other users (such as intern-lee) still get nothing.
xp: 100
difficulty: beginner
expected_time: 8m
concepts:
  - bucket policies
  - Principal element
  - object ARN prefixes
services:
  - s3
  - iam
