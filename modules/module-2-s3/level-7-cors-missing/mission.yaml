name: "The CORS Complaint"
description: >-
  Tidewater Logistics' shipment dashboard, served from
  https://dashboard.tidewater.example, lets staff drag proof-of-delivery photos
  straight into the bucket tidewater-pod-photos and then displays them. Uploads
  die in the browser with "blocked by CORS policy: No
  'Access-Control-Allow-Origin' header", although the same requests work from
  curl. The frontend sends a Content-Type header on its PUT requests and reads
  the ETag response header to confirm each upload.
objective: >-
  Make the browser preflight succeed for the dashboard origin so it can GET and
  PUT objects with a Content-Type header and read ETag from responses. Other
  origins must stay blocked, and the dashboard must not get methods it does not
  use (it never deletes).
xp: 125
difficulty: beginner
expected_time: 10m
concepts:
  - CORS
  - preflight requests
  - AllowedOrigins
  - ExposeHeaders
services:
  - s3
