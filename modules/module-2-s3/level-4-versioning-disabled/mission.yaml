name: "Lost History"
description: >-
  Ledgerly stores customer contracts in the bucket ledgerly-contracts and the
  contract service (IAM user contract-svc) saves revisions by uploading to the
  same key again. Yesterday a paralegal's second upload silently replaced the
  signed Orbit master agreement, and nobody can get the original back. The
  service's code already asks S3 for older revisions, but there are none to
  return.
objective: >-
  Make ledgerly-contracts keep every revision of a contract, so that when
  contract-svc uploads the same key twice, both revisions can be listed and the
  older one can be downloaded again.
xp: 100
difficulty: beginner
expected_time: 6m
concepts:
  - S3 versioning
  - object versions
  - overwrite protection
services:
  - s3
  - iam
