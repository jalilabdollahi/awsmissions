name: "Incomplete Uploads Pile Up"
description: >-
  DataVault's nightly export job uploads multi-gigabyte files to the bucket
  datavault-exports using multipart upload. When the job's pods get evicted,
  the half-finished uploads are never completed or aborted, and their stored
  parts are billed forever. Finance found several of them listed in the bucket.
  The bucket already has a lifecycle rule that moves old exports to cheaper
  storage (saved as lifecycle.json in your workspace), which the team wants to
  keep as it is.
objective: >-
  Stop abandoned multipart uploads from accumulating anywhere in the bucket by
  having them aborted automatically after at most 7 days, keep the existing
  storage-class transition rule working, and clean up the incomplete uploads
  that are there right now.
xp: 200
difficulty: intermediate
expected_time: 14m
concepts:
  - multipart uploads
  - AbortIncompleteMultipartUpload
  - lifecycle configuration replacement
services:
  - s3
