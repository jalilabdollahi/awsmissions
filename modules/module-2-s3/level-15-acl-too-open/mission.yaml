name: "Public by Accident"
description: >-
  Sunrise Studio shares wedding galleries from the bucket sunrise-photos. A
  security scan flagged it: the bucket ACL grants READ to the AllUsers group,
  and the two gallery photos carry public-read ACLs of their own, left over
  from an old uploader script. The web app (IAM user renderer-app) reads the
  photos through its own IAM permissions, never through ACLs. The bucket still
  allows ACLs, which is how the script got away with it.
objective: >-
  Remove every public ACL grant from the bucket and from the existing objects
  without deleting any photo, make sure ACLs cannot expose the bucket again, and
  keep renderer-app able to read the galleries.
xp: 150
difficulty: intermediate
expected_time: 12m
concepts:
  - S3 ACLs
  - object ownership
  - public access
  - AllUsers grantee
services:
  - s3
  - iam
