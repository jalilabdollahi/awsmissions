name: "Manifest Not Found"
description: >-
  Harborline Freight's dock scanners push container manifests through a small
  ingest service that runs as the IAM user ingest-bot. After last night's
  region migration the service restarts in a loop and the log is full of
  NoSuchBucket errors. The service configuration is in ingest.env in your
  workspace. Somebody mentioned that a bucket "with almost the same name" was
  created during the migration.
objective: >-
  Make the manifest bucket that the ingest service is configured to use
  available, so ingest-bot can store a manifest in it and read it back.
xp: 75
difficulty: beginner
expected_time: 4m
concepts:
  - S3 bucket names
  - bucket creation
  - NoSuchBucket
services:
  - s3
  - iam
