name: "Wrong Domain Allowed"
description: >-
  BrightCart serves product media from the bucket brightcart-media. The
  storefront (https://shop.brightcart.example) loads images fine, but the staff
  admin app at https://admin.brightcart.example cannot upload or delete media:
  the browser reports a CORS error on the preflight. A previous engineer
  already added CORS rules for both apps, saved in cors.json in your workspace,
  and swears they match. The admin app uploads with PUT and removes media with
  DELETE, sending Content-Type headers.
objective: >-
  Fix the CORS configuration so the admin app can PUT and DELETE media while
  the storefront keeps working exactly as before (read-only). No other website
  may be allowed, including look-alike domains.
xp: 175
difficulty: intermediate
expected_time: 12m
concepts:
  - CORS
  - AllowedOrigins matching
  - per-origin rules
services:
  - s3
