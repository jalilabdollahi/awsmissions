name: "History Keeps Vanishing"
description: >-
  Fixline's support desk shows a timeline for every ticket: opened, assigned,
  escalated, resolved. Agents complain that timelines always show a single
  entry, the most recent one. Engineers confirmed the service writes every event
  to the table fixline-ticket-events with a ticketId (string) and an eventAt
  attribute (ISO-8601 string such as 2026-03-02T09:15:00Z), and that no write
  ever fails. The table was built from a quick-start snippet that only declared
  ticketId as key. The service reads a ticket's events with a time window, for
  example "everything since 08:00".
objective: >-
  Fix fixline-ticket-events so that several events for the same ticket are all
  stored, and so that the events of one ticket can be read back in time order
  and filtered by a time window. The table may be recreated; the history it
  currently holds is only the last event per ticket and can be discarded.
xp: 110
difficulty: beginner
expected_time: 8m
concepts:
  - sort keys
  - item identity
  - range queries
services:
  - dynamodb
