name: "The Silent Table"
description: >-
  Greenroom is a newsroom CMS. Legal wants an audit trail: whenever an article
  in the table greenroom-articles is edited, the audit consumer must see what
  the headline was before and what it is now, so it can store the diff. The
  consumer reads the table's change stream, but since go-live the audit log has
  stayed empty and the consumer logs "no stream found for greenroom-articles".
  The table was created from an older template that never switched streams on.
objective: >-
  Turn on DynamoDB Streams for greenroom-articles so that edits to an article
  produce change records with both the item as it was before and as it is after
  the edit. Existing articles must stay in place.
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - DynamoDB Streams
  - stream view type
  - change data capture
services:
  - dynamodb
  - dynamodbstreams
