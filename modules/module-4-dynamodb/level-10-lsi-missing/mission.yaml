name: "The Index You Can't Add Later"
description: >-
  Clinicall books appointments in the table clinic-appointments (partition key
  patientId, sort key apptDate, an ISO date string). Nurses want a patient's
  appointments sorted by urgency, so a developer shipped code that queries an
  index named severity-index (same patientId partition, sorted by the numeric
  attribute severity) and asked ops to "just add the index". The ops engineer
  tried a few update-table variations and could not get DynamoDB to create it.
  The table holds four live appointments that cannot be lost, and the booking
  app reads the reason attribute from the index results.
objective: >-
  Provide severity-index on clinic-appointments (same partition key patientId,
  sorted by severity), returning reason with each result. All four appointments
  must be preserved with all their attributes, under the same table name.
xp: 275
difficulty: advanced
expected_time: 20m
concepts:
  - local secondary index
  - table migration
  - immutable table design
services:
  - dynamodb
