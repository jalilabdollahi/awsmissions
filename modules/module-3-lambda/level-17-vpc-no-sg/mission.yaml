name: "Unguarded VPC"
description: >-
  Granite Analytics' nightly exporter runs in the analytics VPC and needs to
  reach the warehouse database on port 5432. Its subnets are fine, but the
  function was deployed without any security group, and the data team's export
  hangs on the database connection. The warehouse database's firewall
  (warehouse-db-sg) is locked down on purpose and the security team has
  stated that its rules must stay as strict as they are: no CIDR ranges, only
  security groups that are explicitly trusted. The analytics VPC also
  contains a bastion-admin-sg that must never be attached to application code.
objective: >-
  Give the exporter function a security group in analytics-vpc that the
  warehouse database already trusts on port 5432 (or that you make it trust
  without opening the database to any IP range), keep its subnets, and do not
  attach the bastion group.
xp: 350
difficulty: advanced
expected_time: 15m
concepts:
  - security groups
  - security group references
  - Lambda VPC configuration
services:
  - lambda
  - ec2
  - iam
