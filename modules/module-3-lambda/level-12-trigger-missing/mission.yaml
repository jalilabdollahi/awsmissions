name: "The Silent Upload"
description: >-
  Helixia Labs' sequencers drop result files into the S3 bucket helixia-lab-inbox
  all day. A Lambda function, lab-result-indexer, is supposed to add each new
  result to the search table lab-result-index, but clinicians report that
  nothing new shows up. The function itself works (it was tested by hand) and
  S3 is already allowed to call it. The bucket also receives huge raw scan
  images under scans/, and indexing those would cost a fortune.
objective: >-
  Make every new .json file uploaded under results/ in helixia-lab-inbox get
  indexed automatically, and nothing else in the bucket.
xp: 250
difficulty: advanced
expected_time: 15m
concepts:
  - S3 event notifications
  - notification filters
  - Lambda triggers
services:
  - s3
  - lambda
  - dynamodb
  - iam
