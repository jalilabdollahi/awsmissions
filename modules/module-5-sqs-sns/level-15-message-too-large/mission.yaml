name: "Forty Tonnes of Paperwork"
description: >-
  Quill Logistics' nightly job builds the shipping manifest for the next day
  (a JSON document of about 1.3 MB, regenerated into payload/manifest.json in
  your workspace) and sends it to the queue quill-manifest-jobs for the
  customs-filing worker. Since the manifest grew past its old size the send
  fails with a message-size error. The bucket quill-manifest-offload exists
  for exactly this kind of payload, but nobody wired it up.
objective: >-
  Get the full, unmodified payload/manifest.json to the customs-filing worker
  through quill-manifest-jobs. SQS cannot carry a message this large, so the
  document must be stored in S3 (bucket quill-manifest-offload) and the queue
  must carry a small message that tells the worker where to find it. The
  queue message must stay under 1 KiB.
xp: 300
difficulty: advanced
expected_time: 15m
concepts:
  - SQS message size limit
  - claim-check pattern
  - S3 offload
services:
  - sqs
  - s3
