name: "One Strike"
description: >-
  Pinecrest Clinics sends appointment reminders by SMS from the queue
  pinecrest-sms. The SMS provider has short hiccups, and a reminder that fails
  once is normally fine on the second try. Since the queue was given a
  dead-letter queue, though, the ops team sees dozens of perfectly good
  reminders in pinecrest-sms-dlq after every hiccup, and patients miss their
  appointments.
objective: >-
  Make pinecrest-sms tolerate at least two failed attempts of a message before
  it is parked in pinecrest-sms-dlq, while a message that never succeeds must
  still be parked after at most 10 attempts.
xp: 175
difficulty: intermediate
expected_time: 10m
concepts:
  - maxReceiveCount
  - redrive policy tuning
  - transient vs permanent failure
services:
  - sqs
