name: "Receipts on Strike"
description: >-
  Skyline Cinemas' box office publishes a TicketSold event to the default
  event bus for every ticket. An EventBridge rule, skyline-ticket-sold, is
  supposed to forward them to the queue skyline-receipts, which the receipt
  printers in the lobbies read. Since Monday's release no receipts are printing.
  The queue is healthy, the box office is publishing events, and the rule
  exists with the right pattern and the right target, but a deployment script
  left it in the state shown in rule.json.
objective: >-
  Make TicketSold events from skyline.box-office reach skyline-receipts again,
  and keep the rule selective: other event types must still not be forwarded.
xp: 100
difficulty: beginner
expected_time: 6m
concepts:
  - EventBridge rules
  - rule state
  - event delivery to SQS
services:
  - events
  - sqs
