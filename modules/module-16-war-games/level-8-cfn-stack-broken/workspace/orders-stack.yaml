AWSTemplateFormatVersion: "2010-09-09"
Description: Cobalt Retail - order ledger service (migrated from the monolith)

Resources:
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cobalt-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: entryId
          KeyType: HASH

  LedgerFnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cobalt-ledger-fn-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  LedgerFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cobalt-ledger-fn
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LedgerFnRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: cobalt-ledgers
      Code:
        ZipFile: |
          import os
          import boto3

          def handler(event, context):
              table = os.environ["TABLE_NAME"]
              rows = boto3.client("dynamodb").scan(TableName=table, Select="COUNT")["Count"]
              return {"status": "ledger-ok", "entries": rows}

Outputs:
  LedgerArn:
    Description: ARN of the ledger table
    Value: !GetAtt LedgerTable.Arn
    Export:
      Name: cobalt-orders-queue-arn
