name: "No Key"
description: >-
  Lanternfish Labs' document vault seals every uploaded contract with KMS
  before storing it. The vault is configured to use the key alias
  alias/lanternfish-vault, which was supposed to be created by the platform
  team during the migration but never was. Since go-live every upload fails
  with a NotFoundException saying the alias is not found. Security has added
  one requirement: the key must rotate automatically every year.
objective: >-
  Provide the vault with what it expects: a customer-managed symmetric
  encryption key reachable as alias/lanternfish-vault, enabled, with automatic
  key rotation turned on, so that data can be encrypted and decrypted through
  the alias.
xp: 100
difficulty: beginner
expected_time: 8m
concepts:
  - KMS keys
  - key aliases
  - automatic key rotation
services:
  - kms
