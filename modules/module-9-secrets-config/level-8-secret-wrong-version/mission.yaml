name: "Wrong Version"
description: >-
  Sable Streaming rotates the CDN URL-signing key stored in the secret
  sable/cdn/signing-key by hand. On Thursday the new key was stored, and the
  edge servers (which always fetch the default version of the secret) signed
  URLs with it. A runbook step then "rolled back" something in the secret, and
  since then the edge fleet signs URLs with the retired key, which the CDN
  origin refuses. The new key is still in the secret; nobody deleted anything.
objective: >-
  Make the new signing key (the one stored in the newer version of
  sable/cdn/signing-key) the default value again, keeping the retired key
  available as AWSPREVIOUS for the 24-hour overlap period.
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - secret versions
  - staging labels
  - AWSCURRENT / AWSPREVIOUS
services:
  - secretsmanager
