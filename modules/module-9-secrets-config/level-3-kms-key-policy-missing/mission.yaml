name: "No Key Permission"
description: >-
  Orbit Health encrypts patient reports with the KMS key alias/orbit-reports.
  The reporting service runs as the IAM role orbit-report-writer, whose own
  IAM policy already lists the KMS actions it needs. Yet the security audit
  shows the writer would be refused by KMS: when the key was re-created last
  month someone pasted in a key policy that only names the key administrator,
  key-admin, and has no statement for anyone else. A KMS key policy is the
  first thing KMS consults, and IAM policies alone cannot override it.
objective: >-
  Replace the key policy of alias/orbit-reports (key-policy.json in your
  workspace holds the current one) so that orbit-report-writer may use the key
  to encrypt and decrypt data, while key-admin keeps administering it. Do not
  open the key to everyone or hand the writer administrative control.
xp: 175
difficulty: intermediate
expected_time: 15m
concepts:
  - KMS key policies
  - IAM policies vs key policies
  - least privilege
services:
  - kms
  - iam
  - sts
