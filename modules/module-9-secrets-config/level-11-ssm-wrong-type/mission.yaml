name: "Plaintext Secret"
description: >-
  A Harrier Pay security scan flagged the Parameter Store entry
  /harrier/payments/api-key: the card processor's live API key is stored as a
  plain String, readable in clear text by anyone who can call
  ssm:GetParameter, and it appears in console screenshots. The team has its
  own customer-managed key for configuration secrets, alias/harrier-config.
  The sibling parameter /harrier/payments/timeout-ms is harmless and is read by
  a legacy tool that cannot decrypt anything.
objective: >-
  Store /harrier/payments/api-key as an encrypted SecureString under the key
  alias/harrier-config, keeping its value (the service must not need a new
  key), and leave /harrier/payments/timeout-ms as an ordinary String.
xp: 175
difficulty: intermediate
expected_time: 12m
concepts:
  - SecureString
  - parameter types
  - KMS keys for SSM
  - parameter versions
services:
  - ssm
  - kms
