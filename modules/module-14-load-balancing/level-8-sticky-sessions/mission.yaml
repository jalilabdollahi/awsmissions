name: "Cart Amnesia"
description: >-
  Kestrel Outfitters keeps each shopper's cart in the memory of whichever web
  server handled the first request (a decision for the next quarter's backlog).
  Since the second web server joined target group kestrel-web behind
  kestrel-alb, customers report that items "vanish" from their cart every other
  click: their requests bounce between the two servers, and only one of them
  knows about the cart. A rewrite to a shared session store is planned, but not
  this week.
objective: >-
  Make kestrel-alb keep each shopper on the same server for at least a day, using
  a cookie generated by the load balancer, while still spreading new shoppers
  across both servers.
xp: 180
difficulty: intermediate
expected_time: 9m
concepts:
  - sticky sessions
  - lb_cookie
  - target group attributes
services:
  - elbv2
  - ec2
