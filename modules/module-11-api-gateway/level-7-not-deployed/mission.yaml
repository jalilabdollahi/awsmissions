name: "Ready, Tested, Invisible"
description: >-
  Skyhook ships a weather API for drone pilots. The REST API skyhook-weather
  (GET /conditions, backed by the Lambda skyhook-conditions) was finished and
  tested on the stage dev last week. Release day came, the mobile app was
  published pointing at the stage prod, and every request returns 404
  {"message":"Not Found"}. The API configuration itself is complete. The
  function reads a stage variable named tier from the request so that it can tell
  callers which environment answered, and ops wants production to say
  production.
objective: >-
  Publish skyhook-weather on a stage named prod so that
  GET /conditions there works and reports the stage variable tier set to
  production. Leave dev as it is.
xp: 125
difficulty: beginner
expected_time: 10m
concepts:
  - deployments
  - stages
  - stage variables
services:
  - apigateway
  - lambda
