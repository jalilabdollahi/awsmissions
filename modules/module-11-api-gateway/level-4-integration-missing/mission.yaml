name: "A Door Into an Empty Room"
description: >-
  Brewbook is a coffee-roaster catalogue. The search box calls
  GET /brews?roast=dark on the REST API brewbook-api (stage test). The route
  exists, the method is open, and the request is accepted, but nothing useful
  ever comes back: the app shows an empty page or an error. The search logic
  lives in the Lambda function brewbook-search, which reads the roast from the
  query string and returns the matching brews as JSON. Someone built the API
  method by hand and called it a day.
objective: >-
  Connect GET /brews on stage test of brewbook-api to the brewbook-search
  function so that /brews?roast=dark returns the dark roasts and
  /brews?roast=light the light ones.
xp: 120
difficulty: beginner
expected_time: 10m
concepts:
  - method vs integration
  - Lambda proxy integration
  - query string parameters
services:
  - apigateway
  - lambda
