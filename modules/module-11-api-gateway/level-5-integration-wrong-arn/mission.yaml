name: "Dial the Right Number"
description: >-
  Invoicely's customer portal downloads the latest invoice via
  GET /invoices/latest on the REST API invoicely-portal (stage prod). Since
  yesterday's rename of the rendering function the portal shows "Something went
  wrong". Two functions with similar names live in the account:
  invoice-renderer (production) and invoice-renderer-staging (the sandbox
  finance uses for new templates). API Gateway is wired to a function ARN that
  somebody typed by hand. Real customers must get production invoices, and
  finance's staging sandbox must stay out of the customer path.
objective: >-
  Repair the integration of GET /invoices/latest on invoicely-portal so that it
  invokes the production function invoice-renderer and the portal receives its
  invoice again.
xp: 125
difficulty: beginner
expected_time: 10m
concepts:
  - integration URI
  - Lambda ARN
  - updating an integration in place
services:
  - apigateway
  - lambda
