name: "No Key, No Entry"
description: >-
  Atlas Robotics' on-call engineers need to SSH into the atlas-bastion host in
  the public subnet. The instance was launched from the console without choosing
  a key pair, and the team's shared key pair platform-ops already exists in the
  account. Engineers get "Permission denied (publickey)". A key pair can only be
  chosen when an instance is launched; there is no command to add one to a
  running instance.
objective: >-
  Replace the keyless bastion with one that boots with the existing platform-ops
  key pair: in the same subnet (atlas-public) and security group
  (atlas-bastion-sg), same Name tag atlas-bastion. Exactly one atlas-bastion may
  be left running, and the keyless one must be terminated.
xp: 200
difficulty: intermediate
expected_time: 10m
concepts:
  - EC2 key pairs
  - immutable launch parameters
  - instance replacement
services:
  - ec2
