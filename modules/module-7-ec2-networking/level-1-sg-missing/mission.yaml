name: "Launch Day Lockout"
description: >-
  Tindle Books opens its spring sale at noon and the storefront needs one more
  web server. The runbook command in launch-web.sh worked last quarter, but today
  it dies immediately and nothing is launched. Last week's infrastructure cleanup
  removed a lot of "unused" resources from the tindle-prod VPC, and nobody
  remembers what the old launch command depended on.
objective: >-
  Get an instance named tindle-web-1 running in the tindle-prod VPC's public
  subnet, protected by a security group that serves HTTPS (443) to the internet
  and does not expose SSH to the world.
xp: 100
difficulty: beginner
expected_time: 8m
concepts:
  - security groups
  - RunInstances
  - VPC scoping
services:
  - ec2
