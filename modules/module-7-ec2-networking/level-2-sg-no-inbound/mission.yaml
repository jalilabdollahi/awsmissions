name: "Quillpad Is Unreachable"
description: >-
  Quillpad, a small blogging platform, moved its web node into a freshly built
  security group called quillpad-web-sg. The instance is healthy and nginx is up,
  but every reader gets a timeout. The on-call engineer confirms nothing is wrong
  on the host itself.
objective: >-
  Let readers reach the quillpad-web instance over both plain HTTP and HTTPS from
  anywhere, keeping the group attached to the instance. Nothing else should be
  open to the internet.
xp: 100
difficulty: beginner
expected_time: 6m
concepts:
  - security group inbound rules
  - default deny
services:
  - ec2
