name: "Eight-Thousand-Eighty Is Not Home"
description: >-
  Ledgerly's internal ledger-api sits behind the ledger-alb load balancer. After
  a rollout the ALB reports every target as unreachable. Someone opened port
  8080 on ledger-api-sg because "APIs usually listen on 8080", but the platform
  team records the real listening port of each service in Parameter Store, under
  /ledger/api/listen-port.
objective: >-
  Make ledger-api-sg accept traffic on the port the service really listens on,
  only from the ledger-alb-sg load balancer group (not from CIDR ranges), and
  remove the stale 8080 opening.
xp: 100
difficulty: beginner
expected_time: 8m
concepts:
  - security group ports
  - source security groups
  - Parameter Store
services:
  - ec2
  - ssm
