name: "Born Without Credentials"
description: >-
  Ember Analytics' ember-api instance is supposed to read its configuration from
  s3://ember-config at startup. The platform team prepared an IAM role called
  ember-app-role with the right S3 permissions and told the application team "the
  instance can use it". The app still logs "Unable to locate credentials", and the
  security review noted that the role could not be used by EC2 even if it were
  attached.
objective: >-
  Make the running ember-api instance able to use ember-app-role: the instance
  needs an instance profile containing the role, and EC2 must be allowed to assume
  it. The role may read objects in s3://ember-config only (no write access, no
  other buckets).
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - instance profiles
  - role trust policy
  - least privilege
services:
  - ec2
  - iam
  - s3
