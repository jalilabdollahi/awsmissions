name: "Room for Meridian"
description: >-
  Meridian Health is standing up its production network. An engineer already
  created a VPC called meridian-prod in a hurry, but the networking review
  rejected it: it uses the same address space as the shared-services VPC that
  Meridian will peer with later, and DNS hostnames are off, which the Kubernetes
  team needs. VPC address ranges cannot be changed once the VPC exists.
objective: >-
  Make exactly one VPC named meridian-prod (Name tag) exist, with an IPv4 CIDR from
  the 10.0.0.0/8 private range, size between /16 and /20, that overlaps neither
  shared-services nor the default VPC, and with DNS hostnames enabled.
xp: 125
difficulty: beginner
expected_time: 8m
concepts:
  - VPC CIDR planning
  - overlapping address space
  - VPC attributes
services:
  - ec2
