name: "Gossip Behind Closed Doors"
description: >-
  Cobalt Cache runs a three-node membership cluster whose nodes gossip with each
  other on TCP and UDP 7946. The nodes are healthy individually, yet they never
  form a cluster: each one reports "no peers found". They all share the security
  group cobalt-nodes-sg, which only has a rule admitting the monitoring server.
  Cobalt security forbids opening cluster ports to CIDR ranges, because nodes
  are replaced all the time and their addresses change.
objective: >-
  Let the members of cobalt-nodes-sg talk to each other on TCP and UDP 7946,
  without allowing that traffic from any address range and without opening any
  further port. The monitoring rule must stay.
xp: 275
difficulty: advanced
expected_time: 12m
concepts:
  - self-referencing security groups
  - east-west traffic
  - TCP vs UDP rules
services:
  - ec2
