name: "Skyline Café Is Offline"
description: >-
  Skyline Café's online ordering site runs on one instance in the skyline-prod
  VPC's public subnet. It has a public IP and a permissive security group, and
  the subnet's route table even has a default route. Still, customers cannot
  load the page and the instance cannot reach the internet. There are two
  internet gateways in the account: skyline-igw, built for this VPC, and an old
  legacy-igw from a decommissioned project.
objective: >-
  Restore internet access for the skyline-prod public subnet: the default route of
  its route table must lead to an internet gateway that is actually attached to
  skyline-prod. Keep using skyline-igw and do not touch the instance.
xp: 150
difficulty: intermediate
expected_time: 8m
concepts:
  - internet gateway attachment
  - route targets
  - public subnets
services:
  - ec2
