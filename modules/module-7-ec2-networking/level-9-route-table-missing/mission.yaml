name: "Dead End Street"
description: >-
  Harborview Dental's booking site lives in the harborview-prod VPC. The VPC has
  an attached internet gateway, a web subnet and a private db subnet, but both
  subnets use the VPC's automatically created main route table, which only has
  the local route. Patients get timeouts and the web server cannot reach the
  appointment-reminder API. The database subnet must never become reachable from
  the internet.
objective: >-
  Make the web subnet public (default route to the internet gateway) while the
  db subnet stays private (no route to any internet gateway).
xp: 150
difficulty: intermediate
expected_time: 10m
concepts:
  - route tables
  - main route table
  - public vs private subnets
services:
  - ec2
