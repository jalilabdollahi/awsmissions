name: "Invisible Instance"
description: >-
  Orbit Telecom hosts its public status page on the orbit-status instance in the
  orbit-prod public subnet. Routing, the internet gateway and the security group
  have all been reviewed and are correct, yet the page is unreachable: the
  instance only has a private address. A partner firewall allow-lists the
  status page's IP, so whatever address it gets must stay the same across
  stop/start cycles.
objective: >-
  Give the running orbit-status instance a public IPv4 address that is stable
  across restarts. Do not replace the instance.
xp: 175
difficulty: intermediate
expected_time: 10m
concepts:
  - public IPv4 addresses
  - Elastic IPs
  - auto-assign public IP
services:
  - ec2
